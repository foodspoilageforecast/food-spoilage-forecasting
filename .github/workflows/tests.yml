name: Reproducibility checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prediction/run_experiment.py --neural-only --epochs 2 --folds 1 --output-dir results/smoke
      - run: python scripts/prediction/predict.py --checkpoint-dir results/smoke/checkpoints --output-dir results/smoke_inference
